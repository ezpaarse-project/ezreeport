<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ezREEPORT - {{{ titleText }}}</title>

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <h1>{{{ titleText }}}</h1>

    <p>{{{ confirmText }}}</p>

    <p>
      <span class="text-error"> {{{ mailListWarningText }}} </span>
      <br />
      {{{ mailListAdviceText }}}
    </p>

    <p>{{{ changesText }}}</p>

    <form id="unsubscribe-form">
      <input
        type="text"
        name="unsubscribeId"
        value="{{ unsubscribeId }}"
        hidden
        required
      />
      <input type="text" name="email" value="{{ email }}" hidden required />

      <div class="d-flex">
        <input type="submit" value="{{{ confirmActionText }}}" />
        <a href="https://ezmesure.couperin.org/" class="btn-cancel">
          {{{ cancelActionText }}}
        </a>
      </div>
    </form>

    <div id="alert-container"></div>

    <script type="module" nonce="{{ nonce.script }}">
      import { unsubscribeFromTask } from './index.js';

      const form = document.querySelector('#unsubscribe-form');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          unsubscribeFromTask('{{ task.id }}', form, {
            success: '{{{ successResultText }}}',
            error: '{{{ errorResultText }}}',
          });
        });
      }
    </script>
  </body>
</html>
