packages:
  - 'packages/*'
  - 'services/*'

minimumReleaseAge: 1440

# catalog:
#   # deps
#   typescript: ^7.0.2
#   tsx: ^4.23.1 # Don't forget to update the aio stage in Dockerfile
#   ofetch: 2.0.0-alpha.3
#   # dev deps
#   '@types/node': ^24
#   pino-pretty: ^13.1.3

catalog:
  '@types/node': ^24
  date-fns: ^4.1.0
  ofetch: ^2.0.0-alpha.3
  pino: ^10.3.1

catalogs:
  dev:
    typescript: ^7.0.2
    tsx: ^4.21.0
    pino-pretty: ^13.1.3
  build:
    json5: ^2.2.3
    tsdown: ^0.23.0

  sdk:
    nanoid: ^6.0.0
    object-hash: ^3.0.0
    socket.io-client: ^4.8.3

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  better-sqlite3: true
  canvas: true
  core-js: false
  esbuild: false
  fastify-socket.io: false
  lefthook: true
  prisma: false
  sharp: false

syncInjectedDepsAfterScripts:
  - db:generate
  - build:js

injectWorkspacePackages: true
