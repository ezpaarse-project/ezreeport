name: Release All In One container

on:
  push:
    tags:
      - 'ezreeport-report@*'
      - 'ezreeport-files@*'
      - 'ezreeport-mail@*'
      - 'ezreeport-scheduler@*'
      - 'ezreeport-worker@*'

env:
  LEFTHOOK: 'false'
  TURBO_UI: 'false'

concurrency:
  group: 'release-aio'
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.docker_tags.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Checkout tags 🛎️
        run: git fetch --tags --force

      - name: Get tags of image ⚙️
        id: docker_tags
        run: |
          #!/usr/bin/env bash
          DATE="$(date +%Y%m)"

          # Define label and suffix by type of pre-release
          SUFFIX=""
          if ${{ contains(github.ref_name, '-rc.') }}; then
            echo "label=rc" >> $GITHUB_OUTPUT

            SUFFIX="-rc"
          elif ${{ contains(github.ref_name, '-beta.') }}; then
            echo "label=dev" >> $GITHUB_OUTPUT

            SUFFIX="-dev"
          else
            echo "label=stable" >> $GITHUB_OUTPUT
          fi

          # Get latest tag (by type of pre-release)
          echo "Looking for tags looking like ezreeport-aio@${DATE}${SUFFIX}.*"
          tags=$(git tag -l "ezreeport-aio@${DATE}${SUFFIX}.*" --no-column --sort -v:refname)

          if [[ ! -z $tags ]]; then
            # If some tag exists, adds 1 to suffix of latest one
            echo $tags | {
              read latest

              latest_suffix=$(echo $latest | sed 's/.*\.//')
              new_tag="${DATE}${SUFFIX}.$((${latest_suffix} + 1))"

              echo "tag=${new_tag}" >> $GITHUB_OUTPUT
              echo "Resolved ${new_tag}"
            }
          else
            # If tag doesn't exists, set suffix to 0
            new_tag="${DATE}${SUFFIX}.0"

            echo "tag=${new_tag}" >> $GITHUB_OUTPUT
            echo "Resolved ${new_tag}"
          fi

      - name: Push tag 🔖
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

          tag_name="ezreeport-aio@${{ steps.docker_tags.outputs.tag }}"

          git tag $tag_name
          git push origin $tag_name

  build:
    permissions:
      packages: write
    runs-on: ubuntu-latest
    needs: [release]
    steps:
      - name: Docker meta 🔧
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/ezpaarse-project/ezreeport-aio
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=${{ needs.release.outputs.label }}

      - name: Login to GitHub Container Registry 🔑
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU ⚙️
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx ⚙️
        uses: docker/setup-buildx-action@v4

      - name: Build and push 🚚
        uses: docker/build-push-action@v7
        with:
          push: true
          target: aio
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  scan:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    needs: [release, build]
    steps:
      - name: Scan for vulnerability 🔍
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/ezpaarse-project/ezreeport-aio:${{ needs.release.outputs.tag }}'
          exit-code: 0
          format: json
          output: trivy-report.json

      - name: Upload vulnerability scan 🚚
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Generate vulnerability report 🔍
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/ezpaarse-project/ezreeport-aio:${{ needs.release.outputs.tag }}'
          exit-code: 0
          format: template
          template: '@./.trivy/md.tpl'
          output: trivy-report.md
          skip-setup-trivy: true

      - name: Write vulnerability report 📄
        run: cat trivy-report.md >> $GITHUB_STEP_SUMMARY
