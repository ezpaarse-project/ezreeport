name: Release Vue package

on:
  push:
    tags:
      - '@ezpaarse-project/ezreeport-vue@*'

env:
  LEFTHOOK: 'false'
  TURBO_UI: 'false'

concurrency:
  group: 'release-vue'
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Get tags of package ⚙️
        id: npm_tags
        run: |
          {
            if ${{ contains(github.ref_name, '-rc.') }}; then
              echo "tag=rc"
            elif ${{ contains(github.ref_name, '-beta.') }}; then
              echo "tag=dev"
            else
              echo "tag=latest"
            fi
          } >> $GITHUB_OUTPUT

      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup pnpm ⚙️
        uses: pnpm/action-setup@v6

      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies ⚙️
        run: pnpm ci

      - name: Build package 🔧
        env:
          NODE_ENV: production
        run: pnpm turbo run @ezpaarse-project/ezreeport-vue#build:js

      - name: Release 🚀
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: pnpm --filter @ezpaarse-project/ezreeport-vue publish --provenance --tag ${{ steps.npm_tags.outputs.tag }} --access public --no-git-checks

  scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Get version of package ⚙️
        id: version
        run: |
          version=$(echo '${{ github.ref_name }}' | sed -nE 's|^@ezpaarse-project/ezreeport-vue@(.+)$|\1|p')
          echo "tag=${version}" >> $GITHUB_OUTPUT

      - name: Setup node ⚙️
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false

      - name: Install package 🔽
        run: mkdir /tmp/sdk && npm i @ezpaarse-project/ezreeport-vue@${{ steps.version.outputs.tag }}

      - name: Scan for vulnerability 🔍
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: /tmp/sdk
          exit-code: 0
          format: json
          output: trivy-report.json

      - name: Upload vulnerability report 🚚
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Generate vulnerability report 🔍
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: /tmp/sdk
          exit-code: 0
          format: template
          template: '@./.trivy/md.tpl'
          output: trivy-report.md
          skip-setup-trivy: true

      - name: Write vulnerability report 📄
        run: cat trivy-report.md >> $GITHUB_STEP_SUMMARY
