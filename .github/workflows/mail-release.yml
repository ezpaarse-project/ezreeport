name: Release Mail container

on:
  push:
    tags:
      - 'ezreeport-mail@*'

env:
  LEFTHOOK: 'false'
  TURBO_UI: 'false'

concurrency:
  group: 'release-mail'
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Get tags of image ⚙️
        id: docker_tags
        run: |
          {
            if ${{ contains(github.ref_name, '-rc.') }}; then
              echo "tag=rc"
            elif ${{ contains(github.ref_name, '-beta.') }}; then
              echo "tag=dev"
            else
              echo "tag=stable"
            fi
          } >> $GITHUB_OUTPUT

      - name: Docker meta 🔧
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/ezpaarse-project/ezreeport-mail
          tags: |
            type=match,pattern=^ezreeport-mail@(.+)$,group=1
            type=raw,value=${{ steps.docker_tags.outputs.tag }}

      - name: Login to GitHub Container Registry 🔑
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU ⚙️
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx ⚙️
        uses: docker/setup-buildx-action@v4

      - name: Build and push 🚚
        uses: docker/build-push-action@v7
        with:
          push: true
          target: mail
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  scan:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Get version of image ⚙️
        id: version
        run: |
          version=$(echo '${{ github.ref_name }}' | sed -nE 's/^ezreeport-mail@(.+)$/\1/p')
          echo "tag=${version}" >> $GITHUB_OUTPUT

      - name: Scan for vulnerability 🔍
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/ezpaarse-project/ezreeport-mail:${{ steps.version.outputs.tag }}'
          exit-code: 0
          format: json
          output: trivy-report.json

      - name: Upload vulnerability report 🚚
        uses: actions/upload-artifact@v7
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 30

      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Generate vulnerability report 🔍
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'ghcr.io/ezpaarse-project/ezreeport-mail:${{ steps.version.outputs.tag }}'
          exit-code: 0
          format: template
          template: '@./.trivy/md.tpl'
          output: trivy-report.md
          skip-setup-trivy: true

      - name: Write vulnerability report 📄
        run: cat trivy-report.md >> $GITHUB_STEP_SUMMARY
